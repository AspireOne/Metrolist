name: Sync, Build, and Release

# Two modes, one workflow:
#  - schedule / workflow_dispatch -> "mirror" mode: pull in the latest upstream
#    (MetrolistGroup/Metrolist) release and publish it, with our patches on top.
#  - push to main -> "personal" mode: publish an interim release of our own commits.
#
# The merge push in mirror mode uses the default GITHUB_TOKEN, whose pushes never
# trigger further workflow runs -- so a mirror run can never recursively trigger a
# personal-mode run of this same workflow.
#
# Our release git tags are prefixed "fork-v..." so they never collide with upstream's
# "vX.Y.Z" tags. Colliding would break `git fetch upstream --tags` on the next run,
# since our tag points at a merged commit and upstream's points at a pristine one.
# The release *title* stays the bare numeric version, which is what the in-app updater
# compares (it reads the release `name`, not the tag).
on:
  schedule:
    # Daily upstream mirror check. GitHub cron is UTC-only (no DST), so this fixed
    # UTC hour maps to 03:00 Europe/Prague in summer (CEST, UTC+2) and 02:00 in
    # winter (CET, UTC+1) -- a harmless one-hour drift for a nightly release job.
    - cron: "0 1 * * *"
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: >-
          Upstream ref to mirror (tag or commit). Defaults to the latest upstream release.
          Pinning an older tag is what makes the conflict resolver rehearsable: branch off
          main, commit a deliberate collision, and dispatch on that branch with this set.
        required: false
        type: string

permissions:
  contents: write
  # The conflict resolver opens an issue when it cannot produce a merge it can vouch for.
  issues: write

# Serialize all runs: never let two runs (push/push or push/schedule) race on version
# numbers, tags, or releases. Queue rather than cancel -- cancelling mid-publish could
# leave a half-created release.
concurrency:
  group: sync-build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Fork identity, defined once and reused by the build and the verification steps.
      FORK_APP_ID: com.metrolist.music.aspireone
      FORK_APP_NAME: Metrolist++
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          # Do not persist the write-capable token in .git/config: the merged upstream
          # build code (Gradle scripts/plugins) runs in this workspace and could otherwise
          # read it. The token is supplied explicitly only for the push step below; all
          # fetches here are from public repos and need no credentials.
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Both modes need upstream tags: mirror mode to merge the release, and both modes to
      # build the pristine-upstream baseline for the differential unit-test gate.
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/MetrolistGroup/Metrolist.git \
            || git remote set-url upstream https://github.com/MetrolistGroup/Metrolist.git
          # --force so a tag that upstream ever moved can't fail the fetch; our own
          # release tags are prefixed (fork-v...) and untouched by this.
          git fetch --force --tags upstream

      # ---- Mirror mode: sync latest upstream release into main ----

      - name: Merge latest upstream release
        if: github.event_name != 'push'
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          TAG="${UPSTREAM_REF:-$(gh api repos/MetrolistGroup/Metrolist/releases/latest --jq .tag_name)}"
          echo "Upstream ref to mirror: $TAG"
          # Upstream tag (pristine) -- used by the differential test baseline below.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
            echo "Upstream $TAG already in history (no merge needed)."
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture the pre-merge tip explicitly: the verifier diffs the fork's deviations
          # before the merge against those after it, and git only writes ORIG_HEAD once the
          # merge completes -- which, on the conflict path, it never does.
          echo "orig_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Our workflow lives in its own file (fork-release.yml) that upstream has no
          # counterpart for, so it never conflicts; every other workflow is upstream's,
          # untouched by us, so it merges cleanly and simply tracks upstream. We keep
          # those disabled in the GitHub UI rather than fighting them in git.
          if git merge --no-edit "$TAG"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            # The merge may have moved the submodule gitlink; sync the working tree to it.
            git submodule sync --recursive
            git submodule update --init --recursive
            exit 0
          fi

          # Deliberately NOT aborting. The conflicted tree stays on disk for the resolver
          # steps below, which own the abort path. Nothing is committed yet and nothing
          # leaves this runner until the push step far below, so the blast radius of
          # anything that follows is exactly one wasted CI run.
          echo "conflicted=true" >> "$GITHUB_OUTPUT"

          # Two lists drive the scope guard: unmerged paths are what the agent is allowed
          # to touch, cleanly auto-merged paths are what it must leave strictly alone.
          git diff --name-only --diff-filter=U > conflicted-files.txt
          git diff --cached --name-only --diff-filter=ACDMRT > clean-merged-files.txt
          echo "Conflicted files:"; cat conflicted-files.txt
          echo "::warning::Merge conflict merging upstream $TAG in $(wc -l < conflicted-files.txt) file(s); handing over to the resolver."

      # ---- AI conflict resolution (mirror mode, only when the merge actually conflicted) ----

      - name: Write resolver context
        if: steps.mirror.outputs.conflicted == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.mirror.outputs.tag }}
          ORIG_HEAD: ${{ steps.mirror.outputs.orig_head }}
        run: |
          # The agents need to read these from the workspace (their sandbox is scoped to it),
          # so they cannot live in $RUNNER_TEMP. Excluding them locally instead keeps them
          # invisible to git: they can never be committed by accident, and the scope guard's
          # untracked-file check stays honest without maintaining a list of exceptions.
          # .git/info/exclude is local to this checkout and is never committed.
          cat >> .git/info/exclude <<'EOF'
          /merge-context.md
          /conflicted-files.txt
          /clean-merged-files.txt
          /codex-resolve.md
          /codex-verify.json
          /deviations-before.diff
          /deviations-after.diff
          /issue-body.md
          EOF

          # The prompts live in .github/codex/*.md and are static; everything run-specific
          # is written here so the agents can read it off disk rather than being templated.
          {
            echo "# Merge context"
            echo
            echo "- Fork: \`$GITHUB_REPOSITORY\` (long-lived fork of \`MetrolistGroup/Metrolist\`)"
            echo "- Upstream ref being merged: \`$UPSTREAM_TAG\`"
            echo "- Fork tip before the merge: \`$ORIG_HEAD\`"
            echo
            echo "## Conflicted files (you may edit ONLY these)"
            echo '```'
            cat conflicted-files.txt
            echo '```'
          } > merge-context.md
          cat merge-context.md

      - name: Resolve conflicts with Codex
        if: steps.mirror.outputs.conflicted == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/resolve.md
          # Needs to edit the working tree. Writes are confined to the workspace by the
          # sandbox itself rather than by asking the model nicely in the prompt.
          sandbox: workspace-write
          output-file: codex-resolve.md

      - name: Scope guard
        if: steps.mirror.outputs.conflicted == 'true'
        run: |
          fail=0

          # 1) Every conflict must actually be resolved -- no markers left behind.
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            if grep -qE '^(<{7}|={7}|>{7})( |$)' "$f"; then
              echo "::error::Conflict markers still present in $f"
              fail=1
            fi
          done < conflicted-files.txt

          # 2) Files git merged cleanly are out of bounds. This is the blast-radius limit
          #    on an agent holding edit tools; it encodes nothing about what our patches are.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! git diff --quiet -- "$f" 2>/dev/null; then
              echo "::error::Agent modified $f, which git had already merged cleanly (out of scope)."
              fail=1
            fi
          done < clean-merged-files.txt

          # 3) No stray new files. Anything the agent invented is out of scope by definition.
          #    Our own scratch files are in .git/info/exclude, so they do not show up here.
          UNTRACKED="$(git ls-files --others --exclude-standard)"
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Agent created untracked files: $UNTRACKED"
            fail=1
          fi

          exit $fail

      # Deterministic backstop for the agent's self-check. If Codex's sandbox blocked the
      # network (Gradle needs it -- the build cache is disabled), it could not have compiled
      # anything itself, so this is the step that actually proves the resolution builds.
      - name: Verify resolution compiles
        if: steps.mirror.outputs.conflicted == 'true'
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: ./gradlew --console=plain :app:compileFossReleaseKotlin --warning-mode summary

      - name: Compute fork deviations before and after the merge
        if: steps.mirror.outputs.conflicted == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.mirror.outputs.tag }}
          ORIG_HEAD: ${{ steps.mirror.outputs.orig_head }}
        run: |
          # What made the fork the fork, relative to the upstream point main was sitting on.
          BASE="$(git merge-base "$ORIG_HEAD" "$UPSTREAM_TAG")"
          git diff "$BASE" "$ORIG_HEAD" > deviations-before.diff

          # The same thing relative to the new upstream, read off the resolved working tree
          # (the merge is not committed yet, so HEAD is still the pre-merge tip).
          git diff "$UPSTREAM_TAG" > deviations-after.diff

          echo "before: $(wc -l < deviations-before.diff) lines, after: $(wc -l < deviations-after.diff) lines"

      - name: Verify no fork deviation was lost
        if: steps.mirror.outputs.conflicted == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/verify.md
          # A fresh invocation, so it has no stake in defending the resolution, and
          # read-only so it cannot "fix" what it finds.
          sandbox: read-only
          output-schema: .github/codex/verify-schema.json
          output-file: codex-verify.json

      - name: Enforce verifier verdict
        if: steps.mirror.outputs.conflicted == 'true'
        run: |
          cat codex-verify.json
          if [ "$(jq -r '.ok' codex-verify.json)" != "true" ]; then
            echo "::error::Verifier rejected the resolution: $(jq -r '.reasoning' codex-verify.json)"
            exit 1
          fi
          echo "Verifier accepted the resolution."

      - name: Finalise the AI-resolved merge
        if: steps.mirror.outputs.conflicted == 'true'
        id: resolved
        env:
          UPSTREAM_TAG: ${{ steps.mirror.outputs.tag }}
        run: |
          # -u rather than -A: stage modifications and removals of tracked files only, so a
          # stray untracked file could never ride along into the merge commit. Files the merge
          # itself introduced are already staged by git; the conflicted paths are added
          # explicitly because they are still unmerged in the index.
          git add -u
          while IFS= read -r f; do
            [ -n "$f" ] && [ -e "$f" ] && git add -- "$f"
          done < conflicted-files.txt

          # Complete the in-progress merge with git's own prepared message plus a provenance
          # trailer, so anything that came through this path stays auditable in history.
          # After this commit the tree is indistinguishable from a clean merge, and every
          # downstream step is unaware anything unusual happened.
          {
            cat .git/MERGE_MSG
            echo
            echo "Conflicts in this merge were resolved automatically and verified to"
            echo "preserve the fork's deviations from upstream."
            echo
            echo "AI-Resolved-By: openai/codex-action"
          } > merge-commit-msg.txt
          git commit -F merge-commit-msg.txt
          rm -f merge-commit-msg.txt

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "ai_resolved=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Merge conflict resolved automatically"
            echo
            echo "Upstream ref: \`$UPSTREAM_TAG\`"
            echo
            echo '```'
            cat conflicted-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Single failure handler for every step above: abort the merge so nothing is left
      # half-applied, and raise an issue -- a failed run only emails you once and is easy to
      # miss, which would silently stall the nightly mirror.
      - name: Report unresolved conflict
        if: failure() && steps.mirror.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.mirror.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git merge --abort || true

          {
            echo "The nightly mirror could not merge upstream \`$UPSTREAM_TAG\` automatically."
            echo "\`main\` was left untouched and nothing was published."
            echo
            echo "**Run:** $RUN_URL"
            echo
            echo "### Conflicted files"
            echo '```'
            cat conflicted-files.txt 2>/dev/null || echo "(unavailable)"
            echo '```'
            if [ -f codex-verify.json ]; then
              echo "### Verifier verdict"
              echo '```json'
              cat codex-verify.json
              echo '```'
            fi
            if [ -f codex-resolve.md ]; then
              echo "### Resolver notes"
              cat codex-resolve.md
            fi
          } > issue-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mirror blocked: unresolved conflict merging $UPSTREAM_TAG" \
            --body-file issue-body.md \
            --label "automated" 2>/dev/null \
          || gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mirror blocked: unresolved conflict merging $UPSTREAM_TAG" \
            --body-file issue-body.md

      - name: Read merged upstream version
        if: github.event_name != 'push'
        id: mirror_version
        run: |
          # Deliberately its own step: mid-conflict app/build.gradle.kts can contain conflict
          # markers, so this must not run until the merge is complete (clean or resolved).
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Upstream versionName is not a single dotted numeric version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---- Personal mode: interim release of our own commits ----

      - name: Determine personal version
        if: github.event_name == 'push'
        id: personal
        run: |
          git fetch --force --tags origin main

          # Stale/superseded push: a newer commit is already the branch tip. Skip so an
          # older push that happens to run later can't publish a higher version number
          # (with a lower versionCode) than the newer commit. Only the tip is released.
          # FETCH_HEAD is the just-fetched main tip (reliable regardless of tracking-ref
          # refspec configuration).
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "HEAD is behind origin/main (superseded push); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ ! "$BASE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Base versionName is not a single dotted numeric version."
            exit 1
          fi

          # Re-run idempotency: if this exact commit already has a personal tag, REUSE that
          # version rather than minting a new one for the same code -- then let the shared
          # idempotency check decide. If that release is complete it is skipped; if it is an
          # incomplete (draft / missing-asset) partial publish, it is recreated. Skipping
          # here instead would leave a failed personal release permanently unrepaired.
          EXISTING=$(git tag --points-at HEAD -l "fork-v${BASE}.*" | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            echo "HEAD already tagged $EXISTING ; reusing its version."
            echo "version=${EXISTING#fork-v}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest existing 4th component among our fork-v<BASE>.N tags, +1.
          LAST=$(git tag -l "fork-v${BASE}.*" | sed "s|^fork-v${BASE//./\\.}\.||" | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          echo "Base version $BASE, next personal release: ${BASE}.${N}"
          echo "version=${BASE}.${N}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ---- Shared: decide version, idempotency, build, sign, verify, publish ----

      - name: Decide version and whether to proceed
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MIRROR_VERSION: ${{ steps.mirror_version.outputs.version }}
          PERSONAL_SKIP: ${{ steps.personal.outputs.skip }}
          PERSONAL_VERSION: ${{ steps.personal.outputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$PERSONAL_SKIP" = "true" ]; then
              echo "Personal run was skipped upstream; nothing to do."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="$PERSONAL_VERSION"
          else
            VERSION="$MIRROR_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Selected release version is not a single dotted numeric version."
            exit 1
          fi
          TAG="fork-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Retry-edge guard (mirror mode): if a personal release on this base already
          # exists (fork-v${VERSION}.N), the base mirror is superseded -- a personal release
          # is always built on top of the merged main, so it already contains this upstream
          # version. Skipping avoids re-building the base from a main that personal commits
          # have since advanced (which would otherwise mislabel newer source as $VERSION).
          if [ "$EVENT_NAME" != "push" ]; then
            if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' 2>/dev/null \
                 | grep -q "^fork-v${VERSION//./\\.}\."; then
              echo "A personal release on base $VERSION already exists; base mirror superseded. Skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Idempotency: a version is "done" only if a PUBLISHED (non-draft) release for
          # its tag already carries the Metrolist.apk asset. A release that is still a
          # draft, or that exists but is missing the asset (a partial/failed publish), is
          # NOT done -- we recreate it in the Create Release step below. This is what makes
          # a failed publish self-healing rather than permanently skipped.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
               --jq 'select(.isDraft == false) | .assets[].name' 2>/dev/null \
               | grep -qx "Metrolist.apk"; then
            echo "Release $TAG already published with the APK; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version code
        if: steps.release.outputs.proceed == 'true'
        id: code
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # The differential test gate needs a pristine-upstream baseline: the upstream release
      # tag for the current base version. Mirror mode already has it; personal mode derives
      # it from the base version (versionName), since the fork sits on top of that release.
      - name: Determine upstream baseline tag
        if: steps.release.outputs.proceed == 'true'
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          MIRROR_TAG: ${{ steps.mirror.outputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            BASE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            if [[ ! "$BASE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Base versionName is not a single dotted numeric version."
              exit 1
            fi
            TAG="v${BASE}"
          else
            TAG="$MIRROR_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Keep a missing baseline non-fatal here: it is only required when the merged
          # tests fail, and the test step below already fails closed in that case.
          if ! COMMIT=$(git rev-parse -q --verify "${TAG}^{commit}" 2>/dev/null); then
            COMMIT="unresolved"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # Cache the pristine failure set by both tag and resolved commit. Including the commit
      # invalidates the cache if upstream moves a tag, while retaining the readable tag in
      # the key. Upstream ships with some permanently-failing unit tests, so the merged
      # build's tests fail on essentially every run; without this cache we would rebuild
      # the pristine baseline every time instead of once per upstream release target.
      - name: Restore pristine baseline failures
        if: steps.release.outputs.proceed == 'true'
        id: baseline_cache
        uses: actions/cache@v4
        with:
          path: pristine_fails.txt
          key: pristine-fails-${{ steps.baseline.outputs.tag }}-${{ steps.baseline.outputs.commit }}

      # Gate releases on unit tests, differentially in BOTH modes: run the merged (fork)
      # tests, and tolerate a failure only if the SAME test+type also fails on the pristine
      # upstream baseline. Any failure our changes introduce (absent from the baseline)
      # blocks; upstream's own pre-existing failures do not. A plain hard-gate would be
      # unusable because upstream ships with failing tests.
      - name: Run unit tests
        if: steps.release.outputs.proceed == 'true'
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          BASELINE_CACHED: ${{ steps.baseline_cache.outputs.cache-hit }}
          # Required at Gradle *configuration* time (see app/build.gradle.kts): the fork
          # fails the build loudly if DISCORD_APP_ID is unset, so every gradlew invocation
          # -- including this test gate, which runs before the build step -- needs it. The
          # pristine-baseline invocation below is upstream code (with its own fallback) and
          # ignores this, but inheriting it is harmless.
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          TEST_TASK=":app:testFossDebugUnitTest"
          REPORTS="app/build/test-results/testFossDebugUnitTest/*.xml"

          if ./gradlew --console=plain "$TEST_TASK" --warning-mode summary; then
            echo "Merged unit tests passed."
            exit 0
          fi
          echo "::warning::Merged unit tests failed; analysing which tests failed."

          # Which tests failed in the merged build? If none can be parsed, the failure is
          # not a test failure (compile/config) -- fail closed.
          if ! MERGED_FAILS="$(python3 .github/scripts/failed_tests.py "$REPORTS")"; then
            echo "::error::Could not parse merged test reports (compile/config error?). Blocking."
            exit 1
          fi
          if [ -z "$MERGED_FAILS" ]; then
            echo "::error::Build failed without identifiable test failures. Blocking."
            exit 1
          fi
          echo "Merged failures:"; echo "$MERGED_FAILS"

          # Pristine-upstream baseline failures for $BASELINE_TAG (cached; results per tag
          # are immutable). Build it only on a cache miss.
          if [ "$BASELINE_CACHED" = "true" ] && [ -f pristine_fails.txt ]; then
            echo "Using cached pristine baseline for $BASELINE_TAG."
            PRISTINE_FAILS="$(cat pristine_fails.txt)"
          else
            echo "Building pristine upstream baseline at $BASELINE_TAG ..."
            if ! git rev-parse -q --verify "refs/tags/$BASELINE_TAG" >/dev/null; then
              echo "::error::Cannot resolve upstream baseline tag $BASELINE_TAG; failing closed."
              exit 1
            fi
            git worktree add --detach ../pristine-baseline "$BASELINE_TAG"
            git -C ../pristine-baseline submodule update --init --recursive
            ( cd ../pristine-baseline && ./gradlew --console=plain "$TEST_TASK" --warning-mode summary ) || true
            if ! PRISTINE_FAILS="$(python3 .github/scripts/failed_tests.py "../pristine-baseline/$REPORTS")"; then
              git worktree remove --force ../pristine-baseline
              echo "::error::Could not parse pristine upstream test reports; failing closed. Blocking."
              exit 1
            fi
            git worktree remove --force ../pristine-baseline
            printf '%s\n' "$PRISTINE_FAILS" > pristine_fails.txt
          fi
          echo "Pristine upstream failures:"; echo "$PRISTINE_FAILS"

          # Merged failures absent from the pristine set = introduced by our changes.
          NEW_FAILS="$(comm -23 <(printf '%s\n' "$MERGED_FAILS" | sort -u) <(printf '%s\n' "$PRISTINE_FAILS" | sort -u))"
          if [ -n "$NEW_FAILS" ]; then
            echo "::error::Test failures introduced by our changes (fail on our fork but pass on pristine upstream $BASELINE_TAG):"
            echo "$NEW_FAILS"
            exit 1
          fi
          echo "::warning::Every merged failure also fails on pristine upstream $BASELINE_TAG; pre-existing upstream issue, not blocking."

      - name: Build Release APK
        if: steps.release.outputs.proceed == 'true'
        run: |
          # `clean` runs as its own invocation, fully serialized before the build starts.
          # Running it in the same invocation as assemble (as upstream's own workflow does)
          # lets Gradle's parallel task execution start the custom :app:generateProto task's
          # protoc download into app/build/protoc at the same moment clean is deleting
          # app/build -- a real, observed race ("Unable to delete directory ... New files
          # were found") since that task's output isn't declared for Gradle to order against
          # clean. This avoids the race without touching upstream's build script.
          ./gradlew --console=plain clean --warning-mode summary
          ./gradlew --console=plain assembleFossRelease :app:lintFossRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: ${{ env.FORK_APP_ID }}
          METROLIST_APP_NAME: ${{ env.FORK_APP_NAME }}
          METROLIST_VERSION_NAME: ${{ steps.release.outputs.version }}
          METROLIST_VERSION_CODE: ${{ steps.code.outputs.code }}
          UPDATE_REPO: ${{ github.repository }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        if: steps.release.outputs.proceed == 'true'
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a # v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename signed APK
        if: steps.release.outputs.proceed == 'true'
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)

          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

          mv "$SIGNED_APK" "$OUTPUT_DIR/out/Metrolist.apk"

      - name: Verify signed APK
        if: steps.release.outputs.proceed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          EXPECTED_VERSION_NAME: ${{ steps.release.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.code.outputs.code }}
        run: |
          APK="app/build/outputs/apk/foss/release/out/Metrolist.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"

          # 1) The APK must be validly signed at all.
          CERTS="$("$BT/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"

          # 2) It must be signed with OUR permanent key -- not merely *some* valid key. A
          # swapped/regenerated keystore would produce an APK that cannot update existing
          # installs, so assert the certificate SHA-256 against the known fingerprint held
          # in the SIGNING_CERT_SHA256 repository variable (compared colon/case-insensitively).
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | norm)"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Repository variable SIGNING_CERT_SHA256 is not set; cannot verify signing identity."
            exit 1
          fi
          ACTUAL="$(awk '/certificate SHA-256 digest/{print $NF; exit}' <<<"$CERTS" | norm)"
          echo "Expected cert SHA-256: $EXPECTED"
          echo "Actual   cert SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate does not match the fork's permanent key."
            exit 1
          fi

          # 3) Package id, versionName and versionCode must be exactly what we intended.
          BADGING="$("$BT/aapt" dump badging "$APK")"
          PKG="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          VNAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          VCODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          echo "package=$PKG versionName=$VNAME versionCode=$VCODE"

          [ "$PKG" = "$FORK_APP_ID" ] || { echo "::error::package id '$PKG' != '$FORK_APP_ID'"; exit 1; }
          [ "$VNAME" = "$EXPECTED_VERSION_NAME" ] || { echo "::error::versionName '$VNAME' != '$EXPECTED_VERSION_NAME'"; exit 1; }
          [ "$VCODE" = "$EXPECTED_VERSION_CODE" ] || { echo "::error::versionCode '$VCODE' != '$EXPECTED_VERSION_CODE'"; exit 1; }

      - name: Parse release notes from changelog
        if: steps.release.outputs.proceed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          AI_RESOLVED: ${{ steps.resolved.outputs.ai_resolved }}
        run: |
          VERSION="$RELEASE_VERSION"
          chmod +x .github/scripts/parse_changelog.sh

          if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md; then
            echo "Release notes sourced from changelog.md for v$VERSION"
          else
            echo "::warning::v$VERSION not found in changelog.md -- falling back to git log"
            {
              echo "Release of version $VERSION"
              echo ""
              git log --max-count=10 \
                "$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD" \
                --pretty=format:"- %s" --no-merges || echo "- Initial release"
            } > release_notes.md
          fi

          # Make an AI-resolved merge visible on the release itself, not just in git history.
          if [ "$AI_RESOLVED" = "true" ]; then
            {
              echo
              echo "---"
              echo
              echo "_Merge conflicts with upstream were resolved automatically for this release,"
              echo "and verified to preserve this fork's changes._"
            } >> release_notes.md
          fi

      - name: Push merged main
        if: steps.release.outputs.proceed == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token supplied inline (credentials are not persisted in git config) so the
          # write-capable credential never sits in the workspace during the build.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Create Release
        if: steps.release.outputs.proceed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"

          # A push can advance main while this long-running build is in progress. The
          # GITHUB_TOKEN cannot create a tag targeting that now-superseded commit, and
          # tagging the new tip would attach the verified APK to source we did not build.
          # Treat supersession as an expected skip and leave releases/tags untouched.
          BUILT_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$BUILT_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::notice::Release $TAG skipped because main advanced during the build."
            echo "published=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Release Skipped"
              echo "- **Reason**: main advanced during the build"
              echo "- **Version**: $VERSION"
              echo "- **Tag**: $TAG"
              echo "- **Built commit**: $BUILT_COMMIT"
              echo "- **Current main**: $MAIN_COMMIT"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # We only reach here when the release is absent or incomplete (draft / missing
          # APK). Remove any such partial release (and its tag) so we can recreate cleanly.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Removing incomplete existing release $TAG before recreating."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          # Mark this "latest" only if its version is >= the current latest release's, so a
          # mirror of an older base (13.6.1) can't demote a newer personal release
          # (13.6.1.1) that already exists. sort -V does the dotted-version comparison.
          CUR=$(gh release view --repo "$GITHUB_REPOSITORY" --json name --jq .name 2>/dev/null || echo "0.0.0")
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$CUR" | sort -V | tail -1)
          if [ "$HIGHEST" = "$VERSION" ]; then LATEST="--latest"; else LATEST="--latest=false"; fi
          echo "Current latest release: $CUR ; this: $VERSION ; make latest: $LATEST"

          # Tag is prefixed (fork-v...) to avoid colliding with upstream's vX.Y.Z tags;
          # the title is the bare numeric version, which is what the updater compares.
          # --target pins the tag to the exact commit we built and verified; without it,
          # gh would tag the current default-branch tip, which another push could have
          # advanced past our source during the build.
          # --repo is mandatory: with the upstream remote present, gh resolves the
          # base repo to the fork's parent (MetrolistGroup/Metrolist) by default and
          # the run token can't write there (HTTP 403). Pin it to our own repo.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --notes-file release_notes.md \
            $LATEST \
            app/build/outputs/apk/foss/release/out/Metrolist.apk
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Update release summary
        if: steps.release.outputs.proceed == 'true' && steps.publish.outputs.published == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          VERSION_CODE: ${{ steps.code.outputs.code }}
        run: |
          MODE=$([ "$EVENT_NAME" = "push" ] && echo "personal" || echo "mirror")
          {
            echo "## Release Summary"
            echo "- **Mode**: $MODE"
            echo "- **Version**: $RELEASE_VERSION"
            echo "- **Tag**: $RELEASE_TAG"
            echo "- **Version Code**: $VERSION_CODE"
            echo "- **Release URL**: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
